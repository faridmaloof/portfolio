<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Monogram Metallic Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Status Badge Gradient (SDET/Quality Green) -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Container Squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Code bracket accent < / > in background watermark -->
  <path d="M14 26 L8 32 L14 38" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
  <path d="M50 26 L56 32 L50 38" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

  <!-- Monogram: FM (Farid Maloof) -->
  <text x="31" y="41" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="-0.5" 
        text-anchor="middle" 
        fill="url(#textGrad)">FM</text>

  <!-- Quality Assurance / SDET Verified Badge dot -->
  <circle cx="49" cy="15" r="4.5" fill="url(#badgeGrad)" stroke="#0F172A" stroke-width="1.5" />
  <!-- Micro checkmark in badge -->
  <path d="M47.2 15 L48.4 16.2 L50.8 13.8" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>